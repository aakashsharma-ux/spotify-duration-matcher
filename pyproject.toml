[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "spotify-duration-matcher"
version = "1.0.0"
description = "Match downloaded audio files to Google Sheet rows and compare durations"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["spotify", "audio", "duration", "google-sheets", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "click>=8.1,<9.0",
    "rich>=13.0,<14.0",
    "rapidfuzz>=3.0,<4.0",
    "mutagen>=1.47,<2.0",
    "pandas>=2.0,<3.0",
    "gspread>=5.12,<6.0",
    "oauth2client>=4.1,<5.0",
    "flask>=3.0,<4.0",
    "pyyaml>=6.0,<7.0",
]

[project.scripts]
spotify-duration-matcher = "src.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
