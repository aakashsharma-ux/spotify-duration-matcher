# spotify-duration-matcher — default configuration
# All values can be overridden by CLI flags.

# Google Sheets settings
sheet_id: ""                    # Paste the Sheet ID from its URL here
credentials_file: "creds.json" # Path to GCP service-account JSON key

# Audio library
audio_dir: ""                   # Default folder to scan for audio files
recursive: true                 # true = scan subdirectories

# Matching
match_threshold: 55             # 0–100; below this score → UNMATCHED
duration_tolerance_sec: 1.0    # seconds; above this → col S = "YES"

# Duplicate-download detection — flags audio files that look like the same
# song downloaded twice under different site naming conventions (e.g.
# "SpotiMate.io - Lover - The Troggs.mp3" vs "The Troggs - Lover
# (SPOTISAVER).mp3"). Deliberately much stricter than match_threshold above,
# since calling two files duplicates is a stronger claim than matching a
# file to a sheet row.
duplicate_threshold: 90         # 0–100; weighted title/artist score to flag as dupes

# Rename template (Python format string)
# Available keys: idx (int), artist (str), title (str), ext (str with dot)
rename_template: "{idx:03d} - {title} - {artist}{ext}"

# Output
output_dir: "./reports"         # Where CSV reports are saved
cache_db: ".duration_cache.db" # SQLite cache inside audio_dir

# Web UI
web_port: 5050
